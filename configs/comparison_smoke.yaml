seed: 42
raw_dir: data/raw
processed_dir: data/processed/smoke
output_dir: artifacts/comparison/smoke
chunk_size: 10000
row_limit: 50000
train_fraction: 0.60
tuning_fraction: 0.15
calibration_fraction: 0.10
review_rate: 0.01
fraud_loss: 100.0
review_cost: 1.0
review_sensitivity: 0.80
threads: 4
early_stopping_rounds: 10
model_candidates:
  logistic:
    - C: 0.1
      max_iter: 150
      tol: 0.001
  random_forest:
    - n_estimators: 30
      max_depth: 10
      min_samples_leaf: 20
      max_samples: 0.5
  lightgbm:
    - n_estimators: 60
      learning_rate: 0.08
      num_leaves: 15
      min_child_samples: 50
  xgboost:
    - n_estimators: 60
      learning_rate: 0.08
      max_depth: 4
      min_child_weight: 10
  catboost:
    - iterations: 60
      learning_rate: 0.08
      depth: 4
