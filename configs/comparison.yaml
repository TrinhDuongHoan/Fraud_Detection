seed: 42
raw_dir: data/raw
processed_dir: data/processed
output_dir: artifacts/comparison/full
chunk_size: 50000
row_limit: null
train_fraction: 0.60
tuning_fraction: 0.15
calibration_fraction: 0.10
review_rate: 0.01
fraud_loss: 100.0
review_cost: 1.0
review_sensitivity: 0.80
threads: 4
early_stopping_rounds: 40
model_candidates:
  logistic:
    - C: 0.1
      max_iter: 300
      tol: 0.001
    - C: 1.0
      max_iter: 300
      tol: 0.001
  random_forest:
    - n_estimators: 180
      max_depth: 12
      min_samples_leaf: 30
      max_samples: 0.5
    - n_estimators: 180
      max_depth: 16
      min_samples_leaf: 30
      max_samples: 0.5
  lightgbm:
    - n_estimators: 400
      learning_rate: 0.06
      num_leaves: 31
      min_child_samples: 100
      colsample_bytree: 0.85
      reg_lambda: 5.0
    - n_estimators: 400
      learning_rate: 0.06
      num_leaves: 63
      min_child_samples: 150
      colsample_bytree: 0.85
      reg_lambda: 10.0
  xgboost:
    - n_estimators: 400
      learning_rate: 0.06
      max_depth: 5
      min_child_weight: 20
      subsample: 0.8
      colsample_bytree: 0.85
      reg_lambda: 5.0
    - n_estimators: 400
      learning_rate: 0.06
      max_depth: 7
      min_child_weight: 20
      subsample: 0.8
      colsample_bytree: 0.85
      reg_lambda: 10.0
  catboost:
    - iterations: 400
      learning_rate: 0.08
      depth: 5
      l2_leaf_reg: 5.0
    - iterations: 400
      learning_rate: 0.08
      depth: 6
      l2_leaf_reg: 10.0
